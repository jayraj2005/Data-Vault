<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ code }} · DataVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">

      <div class="display fw-bold" style="font-size: 4rem; color: var(--ink);">{{ code }}</div>
      <p class="text-muted mb-4">{{ message }}</p>
      <a href="{{ url_for('login') }}" class="btn btn-brand px-4">Back to Login</a>

  </div>
